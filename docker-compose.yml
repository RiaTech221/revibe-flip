version: '3.8'

services:
  # ============================================================================
  # 1. BASE DE DONNÉES - MySQL 8.0
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: revibeflip-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-revibeflip}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-revibeflip_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-VotreMotDePasseSecurise123!}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - revibeflip-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. BACKEND - Spring Boot 3 / Java 21
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revibeflip-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/revibeflip?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rootpassword}
      REVIBE_JWT_SECRET: ${REVIBE_JWT_SECRET:-9a3f2c5d8e1b4a7f0c3e6b9d2a5f8e1b4a7f0c3e6b9d2a5f8e1b4a7f0c3e6b9d}
      UPLOAD_DIR: /app/uploads/
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - revibeflip-network

  # ============================================================================
  # 3. FRONTEND - React 18 / Vite / Nginx SPA
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: revibeflip-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - revibeflip-network

  # ============================================================================
  # 4. GESTIONNAIRE DE BDD (Adminer) - Accessible sur http://localhost:8081
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: revibeflip-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - revibeflip-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  revibeflip-network:
    driver: bridge
