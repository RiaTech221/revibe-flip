version: '3.8'

services:
  # MySQL Database 8.0 for ReVibe FliP
  mysql:
    image: mysql:8.0
    container_name: revibeflip-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: revibeflip
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Web Manager (Adminer) accessible on http://localhost:8081
  adminer:
    image: adminer
    container_name: revibeflip-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
