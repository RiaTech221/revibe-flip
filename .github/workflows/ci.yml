name: CI - ReVibe FliP Pipeline

on:
  push:
    branches:
      - main
      - develop
      - release
  pull_request:
    branches:
      - main
      - develop
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BACKEND - Java 21 / Spring Boot 3 / Maven
  # ============================================================================
  backend-ci:
    name: Backend (Spring Boot / Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Droits d'exécution sur le Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Compilation et Tests Unitaires / Intégration
        working-directory: backend
        run: ./mvnw clean test

  # ============================================================================
  # 2. FRONTEND - React 18 / TypeScript / Vite
  # ============================================================================
  frontend-ci:
    name: Frontend (React / Vite / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances (Clean Install)
        working-directory: frontend
        run: npm ci

      - name: Vérification TypeScript et Build de Production
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 3. MOBILE - React Native / Expo / TypeScript
  # ============================================================================
  mobile-ci:
    name: Mobile (React Native / Expo Typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Installation des dépendances
        working-directory: mobile
        run: npm ci

      - name: Vérification TypeScript (noEmit)
        working-directory: mobile
        run: npx tsc --noEmit
