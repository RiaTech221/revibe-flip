<svg viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Badge Icon -->
  <rect x="6" y="6" width="48" height="48" rx="16" fill="url(#rfGrad)" />
  
  <!-- Circular Loops -->
  <path d="M 22 24 C 22 18, 27 14, 33 14 C 38.5 14, 42.5 18, 43 22" stroke="white" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 17 L 43 22 L 47 19" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <path d="M 38 36 C 38 42, 33 46, 27 46 C 21.5 46, 17.5 42, 17 38" stroke="white" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 43 L 17 38 L 13 41" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram RF inside icon -->
  <text x="30" y="34" text-anchor="middle" fill="white" font-size="13" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5">RF</text>

  <!-- Text "ReVibe" -->
  <text x="66" y="38" fill="#0f172a" font-size="28" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5">ReVibe</text>

  <!-- Text "FliP" -->
  <text x="172" y="38" fill="url(#textGrad)" font-size="28" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5">FliP</text>

  <!-- Dot accent -->
  <circle cx="230" cy="34" r="3" fill="#ec4899" />
</svg>
