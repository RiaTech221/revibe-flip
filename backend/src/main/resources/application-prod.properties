# ===================================================================
# ReVibe FliP - Production Configuration Profile ('prod')
# Activated via: SPRING_PROFILES_ACTIVE=prod or -Dspring.profiles.active=prod
# Strict 12-Factor App compliant: all secrets injected via environment
# ===================================================================

# -------------------------------------------------------------------
# SERVER CONFIGURATION
# -------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=2048

# -------------------------------------------------------------------
# PRODUCTION DATASOURCE (MySQL / Aurora)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/revibeflip?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:revibeflip_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ChangeMeInProduction!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for Prod)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / HIBERNATE
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# In production, schema should be updated automatically or verified by migrations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable in-memory consoles
spring.h2.console.enabled=false

# -------------------------------------------------------------------
# JWT SECURITY (Mandatory Environment Variable in Prod)
# -------------------------------------------------------------------
revibeflip.jwt.secret=${REVIBE_JWT_SECRET:9a3f2c5d8e1b4a7f0c3e6b9d2a5f8e1b4a7f0c3e6b9d2a5f8e1b4a7f0c3e6b9d}
revibeflip.jwt.expiration-ms=${REVIBE_JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# REVIBE FLIP ESCROW & BUSINESS RULES
# -------------------------------------------------------------------
revibeflip.fees.commission-rate=${REVIBE_COMMISSION_RATE:0.20}
revibeflip.fees.validation-fee-rate=${REVIBE_VALIDATION_FEE_RATE:0.01}

# -------------------------------------------------------------------
# FILE STORAGE & UPLOADS
# -------------------------------------------------------------------
revibeflip.upload.dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# LOGGING (Minimal overhead in production)
# -------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.revibeflip=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
