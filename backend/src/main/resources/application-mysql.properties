# ===================================================================
# MySQL Configuration Profile
# Run with: -Dspring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/revibeflip?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
