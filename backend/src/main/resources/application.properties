# ===================================================================
# ReVibe FliP - Backend Configuration
# ===================================================================
spring.application.name=revibe-flip-backend
server.port=8080

# Active profile: 'dev' (H2 in-memory/file for instant testing) or 'mysql'
spring.profiles.active=dev

# -------------------------------------------------------------------
# DEV PROFILE (H2 Database)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:revibeflipdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# FILE UPLOAD LIMITS (Photos d'annonces & Profil)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# JWT CONFIGURATION
# -------------------------------------------------------------------
revibeflip.jwt.secret=9a3f2c5d8e1b4a7f0c3e6b9d2a5f8e1b4a7f0c3e6b9d2a5f8e1b4a7f0c3e6b9d
revibeflip.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# REVIBE FLIP BUSINESS MODEL RULES (Cahier des Charges)
# -------------------------------------------------------------------
# Commission prélevée par la plateforme sur chaque vente (20%)
revibeflip.fees.commission-rate=0.20
# Frais de validation de chaque transaction / escrow / anti-fraude (1%)
revibeflip.fees.validation-fee-rate=0.01

# -------------------------------------------------------------------
# SWAGGER / OPENAPI DOCUMENTATION
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# UPLOADS DIRECTORY
# -------------------------------------------------------------------
revibeflip.upload.dir=uploads/
